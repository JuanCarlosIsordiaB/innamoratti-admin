name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 9 */5 * *'  # cada 5 días a las 9am UTC
  workflow_dispatch:         # permite correrlo manualmente desde GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" ${{ secrets.APP_URL }}/api/health)
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Error: health endpoint returned $STATUS"
            exit 1
          fi
          echo "Supabase is alive"
