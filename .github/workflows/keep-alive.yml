name: Keep Supabase alive

on:
  schedule:
    - cron: '0 8 */3 * *'  # cada 3 días a las 8am UTC
  workflow_dispatch:        # también se puede correr manualmente

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -f ${{ secrets.APP_URL }}/api/health
